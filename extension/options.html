<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>userscripts</title>
    <style>
      :root {
        --bg: #111;
        --fg: #eee;
        --muted: #999;
        --gap: 12px;
        --pad: 16px;
        --font: 14px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: var(--pad);
        font: var(--font);
        background: var(--bg);
        color: var(--fg);
        max-width: 36em;
      }
      .muted {
        color: var(--muted);
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>userscripts</h1>
    <p class="muted">
      Settings live in <code>extension/config.yaml</code> (copy from
      <code>config.example.yaml</code>). Reload the extension after editing.
    </p>
    <pre id="status" class="muted">loading…</pre>
    <p class="muted">
      linux.do / NodeSeek / expireddomains cadence also live in that file.
      Page panels are read-only. Reload the extension after editing.
    </p>
    <script src="lib/ingest-url.js"></script>
    <script src="lib/notify.js"></script>
    <script src="lib/config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
